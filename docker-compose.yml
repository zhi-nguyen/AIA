version: "3.9"

services:
  # === PostgreSQL + pgvector ===
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aia_user
      POSTGRES_PASSWORD: aia_secret_2024
      POSTGRES_DB: aia_db
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aia_user -d aia_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aia-network

  # === Backend (FastAPI + Python) ===
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aia-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # Hot-reload: mount source code
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aia_user:aia_secret_2024@postgres:5432/aia_db
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - aia-network

  # === Frontend (Next.js + TypeScript) ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aia-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
      - redis
    networks:
      - aia-network

  # === Landing Page (Marketing & Downloads) ===
  landing-page:
    build:
      context: ./landing-page
      dockerfile: Dockerfile
    container_name: aia-landing-page
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      # Map host folder to easily serve/update the .exe without rebuilding image
      - ./landing-page/public/downloads:/app/public/downloads
    env_file:
      - ./landing-page/.env
    networks:
      - aia-network

  # === Redis (Broker for Celery + PubSub) ===
  redis:
    image: redis:7-alpine
    container_name: aia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - aia-network

  # ── Main Celery Worker (chat + TTS + email_assistant tasks) ──────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aia-celery-worker
    command: celery -A celery_app.celery_app worker --loglevel=info -Q celery,default
    restart: unless-stopped
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aia_user:aia_secret_2024@postgres:5432/aia_db
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - aia-network

  # ── Main Celery Beat Scheduler (email_assistant every 15 min) ────────────
  # Triggers hourly_email_assistant on the main backend Celery app.
  # IMPORTANT: Only one instance of this service should ever be running.
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aia-celery-beat
    command: celery -A celery_app.celery_app beat --loglevel=info
    restart: unless-stopped
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aia_user:aia_secret_2024@postgres:5432/aia_db
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      celery-worker:
        condition: service_started
    networks:
      - aia-network

  # ── Crawler Worker (auto_ingest_news + generate_user_proposals) ───────────
  # Processes tasks dispatched by crawler-beat via the "crawler" queue.
  crawler-worker:
    build:
      context: .             # project root — so Dockerfile can COPY both crawler/ and backend/
      dockerfile: crawler/Dockerfile.crawler
    container_name: aia-crawler-worker
    command: >
      celery -A celery_beat_app.crawler_celery_app worker
      --loglevel=info -Q crawler --concurrency=2
    restart: unless-stopped
    volumes:
      - ./crawler:/crawler
      - ./backend:/backend      # shared backend modules (llm/, agents/, tools/, memory/)
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /crawler:/backend
    depends_on:
      - redis
    networks:
      - aia-network

  # ── Crawler Beat Scheduler ────────────────────────────────────────────────
  # Triggers auto_ingest_news and generate_user_proposals every 6 hours.
  # Only one instance of this service should run at a time.
  crawler-beat:
    build:
      context: .             # project root — so Dockerfile can COPY both crawler/ and backend/
      dockerfile: crawler/Dockerfile.crawler
    container_name: aia-crawler-beat
    command: >
      celery -A celery_beat_app.crawler_celery_app beat
      --loglevel=info
    restart: unless-stopped
    volumes:
      - ./crawler:/crawler
      - ./backend:/backend      # shared backend modules
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /crawler:/backend
    depends_on:
      - redis
      - crawler-worker
    networks:
      - aia-network

volumes:
  pgvector_data:
    driver: local

networks:
  aia-network:
    driver: bridge
